name: Tandav Data Sync

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run Scraper
        run: python sync.py

      - name: Commit and Push
        run: |
          git config --global user.name "Tandav Bot"
          git config --global user.email "bot@tandav.india"
          git add jan_shakti_live.json
          git commit -m "Auto-update Ledger" || exit 0
          git push
